version: "2"
sql:
  - engine: "mysql"
    queries: "./server/sql"
    schema: "./db/schema.sql"
    gen:
      go:
        package: "queries"
        out: "./server/internal/queries"
        # Go initialisms sqlc should keep upper-case when it builds field
        # names, so a column like max_hp becomes MaxHP rather than MaxHp and
        # matches the hand-written structs that mirror it.
        initialisms: ["id", "url", "dc", "ac", "hp", "xp"]
        overrides:
          # NOTE: every VARBINARY(16) column in this schema holds a ULID, and
          # they are all named id or <thing>_id. Matching on the name keeps new
          # tables covered without touching this file. sessions.hash is excluded
          # by naming rather than by luck -- it is not an *_id.
          #
          # sqlc takes the first match, not the most specific one, so the
          # nullable entries sit ABOVE the wildcards. Those three columns are
          # NULL-able in the schema and come out as *ulid.ULID: a nil pointer
          # reads and writes as SQL NULL, where a zero-valued ulid.ULID would
          # have written sixteen zero bytes instead.
          #
          # A non-ULID column matching one of these names needs its own entry
          # above the wildcards for the same reason.
          - column: "*.asset_id"
            nullable: true
            go_type: &nullable_ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
              pointer: true
          - column: "*.character_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "*.room_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "*.id"
            go_type: &ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
          - column: "*.user_id"
            go_type: *ulid
          - column: "*.owner_id"
            go_type: *ulid
          - column: "*.asset_id"
            go_type: *ulid
          - column: "*.character_id"
            go_type: *ulid
          - column: "*.room_id"
            go_type: *ulid
