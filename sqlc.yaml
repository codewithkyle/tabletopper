version: "2"
sql:
  - engine: "mysql"
    queries: "./server/sql"
    schema: "./db/schema.sql"
    gen:
      go:
        package: "queries"
        out: "./server/internal/queries"
        overrides:
          # NOTE: every VARBINARY(16) column holds a ULID. Mapping them to
          # ulid.ULID moves the length check into Scan, so a malformed value
          # surfaces as a query error rather than a panic when converting a
          # short slice to [16]byte. NULL scans to the zero ULID.
          # sessions.hash is VARBINARY(32) of random bytes and stays []byte.
          - column: users.id
            go_type: &ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
          - column: sessions.id
            go_type: *ulid
          - column: sessions.user_id
            go_type: *ulid
          - column: sessions.character_id
            go_type: *ulid
          - column: sessions.room_id
            go_type: *ulid
          - column: assets.id
            go_type: *ulid
          - column: assets.owner_id
            go_type: *ulid
          - column: rooms.id
            go_type: *ulid
          - column: rooms.owner_id
            go_type: *ulid
          - column: monsters.id
            go_type: *ulid
          - column: monsters.owner_id
            go_type: *ulid
          - column: monsters.asset_id
            go_type: *ulid
          - column: characters.id
            go_type: *ulid
          - column: characters.owner_id
            go_type: *ulid
          - column: characters.asset_id
            go_type: *ulid
          - column: spells.id
            go_type: *ulid
          - column: spells.owner_id
            go_type: *ulid
          - column: spells.character_id
            go_type: *ulid
