version: "2"
sql:
  - engine: "mysql"
    queries: "./server/sql"
    schema: "./db/schema.sql"
    gen:
      go:
        package: "queries"
        out: "./server/internal/queries"
        # Go initialisms sqlc should keep upper-case when it builds field
        # names, so a column like max_hp becomes MaxHP rather than MaxHp and
        # matches the hand-written structs that mirror it.
        initialisms: ["id", "url", "dc", "ac", "hp", "xp"]
        overrides:
          # inventory.character_id is NOT NULL and must not be a pointer, which
          # needs saying here because the wildcard further down would make it one
          # anyway. `nullable: true` on an override does NOT restrict that rule
          # to nullable columns -- sqlc takes the first entry whose column
          # pattern matches the name and stops. spells.character_id is the
          # proof: NOT NULL in the schema, *ulid.ULID in models.go. A nil there
          # fails at runtime writing NULL into a NOT NULL column instead of
          # failing to compile, so a NOT NULL *_id sharing a name with one of the
          # nullable rules needs its own entry up here, ahead of them.
          - column: "inventory.character_id"
            go_type: &ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
          # DECIMAL comes back as a string by default. float64 is what lets an
          # unweighed item render blank as `weight == 0` rather than a comparison
          # against "0.00"; the column keeps the two-place rounding either way.
          - column: "inventory.weight"
            go_type: "float64"
          # NOTE: every VARBINARY(16) column in this schema holds a ULID, and
          # they are all named id or <thing>_id. Matching on the name keeps new
          # tables covered without touching this file. sessions.hash is excluded
          # by naming rather than by luck -- it is not an *_id.
          #
          # The three below hand back *ulid.ULID, where a nil pointer reads and
          # writes as SQL NULL and a zero-valued ulid.ULID would have written
          # sixteen zero bytes instead. characters.asset_id and rooms.character_id
          # want that. spells.character_id gets it too and does not want it --
          # see the entry at the top for why, and for what to do about a new one.
          - column: "*.asset_id"
            nullable: true
            go_type: &nullable_ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
              pointer: true
          - column: "*.character_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "*.room_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "*.id"
            go_type: *ulid
          - column: "*.user_id"
            go_type: *ulid
          - column: "*.owner_id"
            go_type: *ulid
          - column: "*.asset_id"
            go_type: *ulid
          - column: "*.character_id"
            go_type: *ulid
          - column: "*.room_id"
            go_type: *ulid
