version: "2"
sql:
  - engine: "mysql"
    queries: "./server/sql"
    schema: "./db/schema.sql"
    gen:
      go:
        package: "queries"
        out: "./server/internal/queries"
        initialisms: ["id", "url", "dc", "ac", "hp", "xp", "cr"]
        overrides:
          - column: "inventory.character_id"
            go_type: &ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
          - column: "attacks.character_id"
            go_type: *ulid
          - column: "spells.character_id"
            go_type: *ulid
          - column: "spell_slots.character_id"
            go_type: *ulid
          - column: "journals.character_id"
            go_type: *ulid
          - column: "shares.resource_id"
            go_type: *ulid
          - column: "inventory.weight"
            go_type: "float64"
          - column: "*.asset_id"
            nullable: true
            go_type: &nullable_ulid
              import: "github.com/oklog/ulid/v2"
              package: "ulid"
              type: "ULID"
              pointer: true
          - column: "*.character_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "*.room_id"
            nullable: true
            go_type: *nullable_ulid
          - column: "assets.journal_id"
            go_type: *nullable_ulid
          - column: "users.avatar_asset_id"
            go_type: *nullable_ulid
          - column: "rooms.scene_id"
            go_type: *nullable_ulid
          - column: "scenes.preview_id"
            go_type: *nullable_ulid
          - column: "assets.tile_gen"
            go_type: *nullable_ulid
          - column: "assets.tile_lease"
            go_type: *nullable_ulid
          - column: "*.id"
            go_type: *ulid
          - column: "*.user_id"
            go_type: *ulid
          - column: "*.owner_id"
            go_type: *ulid
          - column: "*.asset_id"
            go_type: *ulid
          - column: "*.character_id"
            go_type: *ulid
          - column: "*.room_id"
            go_type: *ulid
          - column: "*.monster_id"
            go_type: *ulid
