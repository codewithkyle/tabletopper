services:
  mysql:
    image: mysql:9.6
    command: --default-time-zone='+00:00'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tts-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  dbmate:
    image: ghcr.io/amacneil/dbmate:v2.29.3
    command: ["--wait", "--migrations-dir", "/db/migrations", "up"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:?}
    volumes:
      - ./db/migrations:/db/migrations:ro
    networks:
      - tts-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  tabletopper:
    image: codewithkyle/tabletopper:prod
    env_file: app.env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tts-network
    depends_on:
      dbmate:
        condition: service_completed_successfully
    restart: always

volumes:
  db_data:

networks:
  tts-network:
    driver: bridge
